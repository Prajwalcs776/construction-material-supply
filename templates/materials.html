<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Materials | Construction Material Supply</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/materials.css') }}">
</head>

<body>

<div class="materials-page">

    <header class="materials-header">

        <div>
            <span class="page-label">SUPPLY MANAGEMENT</span>
            <h1>Materials</h1>
            <p>Manage construction materials and available stock.</p>
        </div>

        <a class="back-link"
           href="{{ url_for('dashboard.manager_dashboard') }}">
            ← Dashboard
        </a>

    </header>

    <main class="materials-content">

        <section class="materials-summary">

            <div class="summary-card">
                <span>Total Materials</span>
                <strong>0</strong>
            </div>

            <div class="summary-card">
                <span>Available Stock</span>
                <strong>0</strong>
            </div>

            <div class="summary-card">
                <span>Low Stock</span>
                <strong>0</strong>
            </div>

        </section>

        <section class="materials-panel">

            <div class="panel-header">

                <div>
                    <span class="panel-label">INVENTORY</span>
                    <h2>Construction Materials</h2>
                </div>

                <button class="add-material-btn" type="button">
                    + Add Material
                </button>

            </div>

            <div class="empty-state">

                <div class="empty-icon">□</div>

                <h3>No materials available</h3>

                <p>
                    Materials added to the system will appear here.
                </p>

            </div>

        </section>

    </main>

</div>

</body>
</html>
